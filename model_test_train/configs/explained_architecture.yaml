training:
  lr: 0.0003
  weight-decay: 0.0001
  bs: 32
  scheduler: 'steplr'
  gamma: 0.5
  step-size: 8
  rebalancing_fake: 0.4
  rebalancing_real: 1
  frames-per-video: 20

model:
  image-size: 224
  patch-size: 7
  num-classes: 1
  dim: 160
  depth: 6
  dim-head: 64
  heads: 8
  mlp-dim: 2048
  emb-dim: 392
  dropout: 0.2
  emb-dropout: 0.2