training:
  lr: 0.001
  weight-decay: 1e-4
  bs: 32
  scheduler: 'cosine'
  T_max: 50
  eta_min: 0.000001
  rebalancing_fake: 0.3
  rebalancing_real: 1
  frames-per-video: 20 # Equidistant frames
  accumulation_steps: 2  # Effective batch size = bs * accumulation_steps = 64
  
model:
  image-size: 224
  patch-size: 7
  num-classes: 1
  dim: 160
  depth: 6
  dim-head: 64
  heads: 8
  mlp-dim: 2048
  emb-dim: 392
  dropout: 0.15
  emb-dropout: 0.15
